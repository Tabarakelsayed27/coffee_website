<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Website</title>
    <!-- google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:opsz,wght@10..72,100..900&display=swap"
        rel="stylesheet">
    <!-- google font  -->
    <!-- wow css  -->
    <link rel="stylesheet" href="css/wow.min.css">
    <!-- animate css -->
    <link rel="stylesheet" href="css/animate.min.css">
    <!-- fontawsome css  -->
    <link rel="stylesheet" href="css/all.min.css">
    <!-- bootstrap css  -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- mdbootstrap css  -->
    <link rel="stylesheet" href="css/mdb.min.css">
    <!-- css style  -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
    <!-- ***** Start Header/Navbar section ***** -->
    <header>
        <nav class="navbar section-content">
            <!-- ***** Logo Start ***** -->
            <a href="#" class="nav-log">
                <h2 class="logo-text">☕Coffee</h2>
            </a>
            <!-- ***** Logo End ***** -->
            <!-- ***** Menu Start ***** -->
            <ul class="nav-menu">
                <!-- button x close -->
                <button id="menu-close-button" class="fas fa-times"></button>
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="menu.html" class="nav-link">Menu</a>
                </li>
                <li class="nav-item">
                    <a href="testimonials.html" class="nav-link">Testimonials</a>
                </li>
                <li class="nav-item">
                    <a href="gallery.html" class="nav-link">Gallery</a>
                </li>
                <li class="nav-item">
                    <a href="contact.html" class="nav-link active">Contact</a>
                </li>
            </ul>
            <!-- button = open -->
            <button id="menu-open-button" class="fas fa-bars"></button>
            <!-- ***** Menu End ***** -->
        </nav>
    </header>
    <!-- ***** End Header/Navbar section ***** -->

    <main>

        <!-- ===== Hero ===== -->

        <section class="contact-hero">

            <div class="section-content text-center">

                <span class="sub-title">Contact Us</span>

                <h1>Get In Touch</h1>

                <p>
                    We'd love to hear from you. Send us a message or visit our café.
                </p>

            </div>

        </section>

        <!-- ===== Contact ===== -->

        <section class="contact-section">

            <div class="section-content">

                <div class="row align-items-center">

                    <!-- Contact Info -->

                    <div class="col-lg-5">

                        <div class="contact-info">

                            <h2>Contact Information</h2>

                            <p>
                                <i class="fas fa-map-marker-alt"></i>
                                Zagazig, Egypt
                            </p>

                            <p>
                                <i class="fas fa-phone"></i>
                                +20 100 123 4567
                            </p>

                            <p>
                                <i class="fas fa-envelope"></i>
                                coffee@email.com
                            </p>

                            <p>
                                <i class="fas fa-clock"></i>
                                Every Day : 8:00 AM - 11:00 PM
                            </p>

                            <div class="social-links">

                                <a href="#"><i class="fab fa-facebook-f"></i></a>

                                <a href="#"><i class="fab fa-instagram"></i></a>

                                <a href="#"><i class="fab fa-x-twitter"></i></a>

                                <a href="#"><i class="fab fa-youtube"></i></a>

                            </div>

                        </div>

                    </div>

                    <!-- Contact Form -->

                    <div class="col-lg-7">

                        <form class="contact-form">

                            <input type="text" placeholder="Your Name">

                            <input type="email" placeholder="Your Email">

                            <input type="text" placeholder="Subject">

                            <textarea rows="6" placeholder="Your Message"></textarea>

                            <button type="submit">Send Message</button>

                        </form>

                    </div>

                </div>

            </div>

        </section>

        <!-- ===== Map ===== -->

        <section class="map-section">

            <div class="section-content">

                <h2 class="text-center mb-5">Find Us</h2>

                <iframe src="https://www.google.com/maps?q=zagazig&output=embed" width="100%" height="400"
                    style="border:0; border-radius:20px;" loading="lazy">
                </iframe>

            </div>

        </section>

    </main>

    <button id="backToTop">
        <i class="fas fa-arrow-up"></i>
    </button>



    <!-- fontawsome js -->
    <script src="js/all.min.js"></script>
    <!-- wow js  -->
    <script src="js/wow.min.js"></script>
    <script>
        new WOW().init();
    </script>
    <!-- wow js  -->
    <!-- jquery js  -->
    <script src="js/jquery.slim.min.js"></script>
    <!-- popper js  -->
    <script src="js/popper.min.js"></script>
    <!-- bootstrap js  -->
    <script src="js/bootstrap.min.js"></script>
    <!-- mbdootstrap js  -->
    <script src="js/mdb.min.js"></script>
    <!-- main js  -->
    <script src="js/main.js"></script>

</body>

</html>
